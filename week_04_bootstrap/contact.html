		<h3>Contact</h3>
		<!-- define the form for data submission -->
		<form name="contact" method="post" onSubmit="return check_form();">
			<p>Use the form below to get in contact with us about any kind of inquiry. Please allow 24-48 hours for us to review your message and get back to you with relavent information.</p>
			
			<div class="mb-3">
				<label for="first_name" class="form-label">First Name</label>
				<input type="text" class="form-control" id="first_name" name="first_name" placeholder="John">
			</div>
			<div class="mb-3">
				<label for="last_name" class="form-label">Last Name</label>
				<input type="text" class="form-control" id="last_name" name="last_name" placeholder="Smith">
			</div>
			<div class="mb-3">
				<label for="address" class="form-label">Address</label>
				<input type="text" class="form-control" id="address" name="address" placeholder="1234 Apple Ave.">
			</div>
			<div class="mb-3">
				<label for="phone" class="form-label">Phone Number</label>
				<input type="text" class="form-control" id="phone" name="phone" placeholder="5553215487">
			</div>
			<div class="mb-3">
				<label for="inquiry" class="form-label">Inquiry</label>
				<textarea class="form-control" id="inquiry" name="inquiry" rows="3" placeholder="What can we help you with?"></textarea>
			</div>

			<input type="submit" value="Submit" class="btn btn-primary mb-3">
		</form>
	</body>
